name: Verify game
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  gameplay-and-rendering:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        check: [physics, visual]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/graphics-test.mjs && node scripts/smoke-car.mjs
      - name: Complete world geometry and resource audit
        if: matrix.check == 'visual'
        run: |
          node scripts/world-audit.mjs
          node scripts/track-geometry.mjs qa/track-layouts
      - name: AI laps and traffic regression suite
        if: matrix.check == 'physics'
        run: node scripts/ai-test.mjs
      - run: npx playwright-core install --with-deps chromium
      - name: Start game
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/racer2-vite.log 2>&1 &
          node --input-type=module -e 'import {chromium} from "playwright-core"; console.log("CHROME_EXE=" + chromium.executablePath())' >> "$GITHUB_ENV"
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5173/ > /dev/null && break; sleep 1; done
      - name: Start base revision for before/after rendering
        if: matrix.check == 'visual'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add ../racer2-base "$BASE_SHA"
          ln -s "$PWD/node_modules" ../racer2-base/node_modules
          (cd ../racer2-base && npm run dev -- --host 127.0.0.1 --port 5174 > /tmp/racer2-base.log 2>&1) &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5174/ > /dev/null && break; sleep 1; done
      - name: Driving and circuit regression suite
        if: matrix.check == 'physics'
        run: node scripts/physics-test.mjs
      - name: All-car before and after comparison
        if: matrix.check == 'visual'
        run: |
          GAME_URL=http://localhost:5174/ QA_DIR=qa/before/cars node scripts/car-shapes.mjs
          QA_DIR=qa/after/cars node scripts/car-shapes.mjs
      - name: All-circuit before and after comparison
        if: matrix.check == 'visual'
        run: |
          GAME_URL=http://localhost:5174/ node scripts/audit-shots.mjs qa/before/tracks
          node scripts/audit-shots.mjs qa/after/tracks
      - name: Visual and performance comparison
        if: matrix.check == 'visual'
        env:
          BASELINE_URL: http://localhost:5174/
        run: node scripts/browser-check.mjs
      - name: Car selection regression suite
        if: matrix.check == 'visual'
        run: node scripts/car-selection-test.mjs
      - uses: actions/upload-artifact@v4
        if: always() && matrix.check == 'visual'
        with:
          name: racer2-track-gp
          path: |
            qa/before/tracks/gp-*.png
            qa/after/tracks/gp-*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && matrix.check == 'visual'
        with:
          name: racer2-track-sprint
          path: |
            qa/before/tracks/sprint-*.png
            qa/after/tracks/sprint-*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && matrix.check == 'visual'
        with:
          name: racer2-track-downtown
          path: |
            qa/before/tracks/downtown-*.png
            qa/after/tracks/downtown-*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && matrix.check == 'visual'
        with:
          name: racer2-track-alpine
          path: |
            qa/before/tracks/alpine-*.png
            qa/after/tracks/alpine-*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && matrix.check == 'visual'
        with:
          name: racer2-track-dunes
          path: |
            qa/before/tracks/dunes-*.png
            qa/after/tracks/dunes-*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && matrix.check == 'visual'
        with:
          name: racer2-track-parco
          path: |
            qa/before/tracks/parco-*.png
            qa/after/tracks/parco-*.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && matrix.check == 'visual'
        with:
          name: racer2-visual-and-performance-checks
          path: |
            qa/
            !qa/before/tracks/**
            !qa/after/tracks/**
          retention-days: 14
